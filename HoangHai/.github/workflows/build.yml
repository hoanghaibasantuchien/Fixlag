name: Build HoangHai APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:      # cho phép bấm nút build tay

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: ☕ Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🐘 Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: 🔑 Cấp quyền thực thi gradlew
        run: chmod +x ./gradlew || true

      - name: 🛠️ Build Debug APK
        run: gradle assembleDebug --stacktrace

      - name: 📦 Upload APK Debug
        uses: actions/upload-artifact@v4
        with:
          name: HoangHai-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: 🛠️ Build Release APK (unsigned)
        run: gradle assembleRelease --stacktrace
        continue-on-error: true

      - name: 📦 Upload APK Release (unsigned)
        uses: actions/upload-artifact@v4
        with:
          name: HoangHai-release-unsigned-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30
          if-no-files-found: ignore

      - name: 🚀 Tạo Release tự động (nếu gắn tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
